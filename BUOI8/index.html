<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chào mừng theo dõi thời gia thực tế</title>
    
</head>
<body>
    <!-- Thẻ chứa nội dung lời chào-->
    <h1 id="greeting"></h1>
    <p>Chào mừng các bạn đến với website của chúng tôi</p>
    <script>
        // Lấy giờ hiện tại từ hệ thống (0 đến 23)
        const currentHour = new Date().getHours();
        let message = "";

        // Kiểm tra giờ hiện tại và gán thông điệp phù hợp
        if (currentHour >= 5 && currentHour < 12) {
            message = "Chào buổi sáng!";
        } else if (currentHour >= 12 && currentHour < 18) {
            message = "Chào buổi chiều!";
        } else if (currentHour >= 18 && currentHour < 22) {
            message = "Chào buổi tối!";
        } else {
            message = "Chúc bạn ngủ ngon!";
        }

        // Hiển thị thông điệp trong thẻ h1
        document.getElementById("greeting").innerHTML = message;
    </script>
</body>
</html>
